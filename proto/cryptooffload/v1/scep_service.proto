syntax = "proto3";

package cryptooffload.v1;

import "cryptooffload/v1/common.proto";

option go_package = "github.com/cryptooffload/sdk-go/gen/cryptooffload/v1;cryptooffloadv1";
option java_package = "cryptooffload.v1";
option java_multiple_files = true;

// SCEP offload（RFC 8894）：PKIO 解析与 CertRep 构建。
service ScepService {
  // 解析 SCEP PKIO 外层 SignedData + 内层 EnvelopedData，解密得到 CSR。
  rpc ParseRequest(ParseScepRequestRequest) returns (ParseScepRequestResponse);
  // 构建 SUCCESS CertRep（pkiStatus=0，含 EnvelopedData；算法由 envelope_cipher 指定）。
  rpc BuildSuccessCertRep(BuildScepSuccessCertRepRequest) returns (BuildScepCertRepResponse);
  // 国密 SUCCESS CertRep：内层双证 + SKF Base64 信封；外层 EnvelopedData 算法可选（一次 RPC）。
  rpc BuildGmSuccessCertRep(BuildScepGmSuccessCertRepRequest) returns (BuildScepCertRepResponse);
  // 构建 FAILURE CertRep（pkiStatus=2，无 envelop）。
  rpc BuildFailureCertRep(BuildScepFailureCertRepRequest) returns (BuildScepCertRepResponse);
  // 构建 PENDING CertRep（pkiStatus=3，待人工审批，无 envelop / failInfo）。
  rpc BuildPendingCertRep(BuildScepPendingCertRepRequest) returns (BuildScepCertRepResponse);
}

message ParseScepRequestRequest {
  bytes scep_der = 1;
  // CA 私钥 key_id（ImportKey 时需附带 CA 证书 certificate_data）
  string ca_key_id = 2;
}

message ParseScepRequestResponse {
  bytes csr_der = 1;
  bytes wrapper_cert_der = 2;
}

// CertRep 外层 EnvelopedData 对称算法。
// 0 表示未指定（服务端默认按 AES-128-CBC 处理）；1–5 为可用算法；
// 6 为保留的 DES-CBC 旧值（服务端会拒绝）。
enum ScepEnvelopeCipher {
  SCEP_ENVELOPE_CIPHER_UNSPECIFIED = 0;
  SCEP_ENVELOPE_CIPHER_AES_128_CBC = 1;
  SCEP_ENVELOPE_CIPHER_AES_256_CBC = 2;
  SCEP_ENVELOPE_CIPHER_AES_128_GCM = 3;
  SCEP_ENVELOPE_CIPHER_AES_256_GCM = 4;
  SCEP_ENVELOPE_CIPHER_DES3_CBC = 5;
  // 旧值保留用于兼容历史协议语义；服务端视为非法参数。
  SCEP_ENVELOPE_CIPHER_DES_CBC_UNSUPPORTED = 6;
}

message BuildScepSuccessCertRepRequest {
  string ca_key_id = 1;
  string transaction_id = 2;
  // 请求 senderNonce → 响应 recipientNonce
  bytes recipient_nonce = 3;
  // 响应 senderNonce；空则服务端自动生成 16 字节
  bytes sender_nonce = 4;
  bytes issued_cert_der = 5;
  bytes wrapper_cert_der = 6;
  // 外层 EnvelopedData 算法；省略时服务端按 AES-128-CBC 处理（DES-CBC 不支持）
  ScepEnvelopeCipher envelope_cipher = 7;
}

// 国密 Enroll SUCCESS：内层 SignedData 含 [0]签名证、[1]加密证 + id-data(SKF Base64 字符串)；
// 外层 CertRep 仍为标准 SCEP（CA 签名 + EnvelopedData 加密给 wrapper RSA 公钥）。
message BuildScepGmSuccessCertRepRequest {
  string ca_key_id = 1;
  string transaction_id = 2;
  bytes recipient_nonce = 3;
  bytes sender_nonce = 4;
  bytes sign_cert_der = 5;
  bytes encryption_cert_der = 6;
  // RA 返回的 SKF 密钥对密文（Base64 ASCII，原样写入内层 eContent）
  bytes skf_content = 7;
  // EnvelopedData 接收方（与 BuildSuccessCertRep 相同，通常为终端 wrapper RSA 证）
  bytes wrapper_cert_der = 8;
  // 外层 EnvelopedData 算法；省略时服务端按 AES-128-CBC 处理（DES-CBC 不支持）
  ScepEnvelopeCipher envelope_cipher = 9;
}

message BuildScepFailureCertRepRequest {
  string ca_key_id = 1;
  string transaction_id = 2;
  bytes recipient_nonce = 3;
  bytes sender_nonce = 4;
  // RFC 8894 failInfo：0=badAlg, 1=badMessageCheck, 2=badRequest, 3=badTime, 4=badCertId
  uint32 fail_info = 5;
  string fail_info_text = 6;
}

message BuildScepPendingCertRepRequest {
  string ca_key_id = 1;
  string transaction_id = 2;
  // 请求 senderNonce → 响应 recipientNonce
  bytes recipient_nonce = 3;
  // 响应 senderNonce；空则服务端自动生成 16 字节
  bytes sender_nonce = 4;
}

message BuildScepCertRepResponse {
  bytes certrep_der = 1;
}
