services:
  crypto-offload:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "50051:50051"
    command:
      - --listen
      - "0.0.0.0:50051"
      - --crypto-max-inflight
      - "4"
      - --crypto-blocking-threads
      - "8"
    deploy:
      resources:
        limits:
          cpus: "4"
    restart: unless-stopped
