[project]
name = "cryptooffload-sdk"
version = "0.2.4"
description = "Python SDK for CryptoOffloadService"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.68.0",
    "protobuf>=5.28.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.68.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptooffload*"]
