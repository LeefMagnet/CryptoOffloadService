[package]
name = "crypto-offload-demo"
version = "0.2.2"
edition = "2021"
publish = false

[[example]]
name = "demo"
path = "demo.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cryptooffload-sdk = { path = "../../sdk/rust" }
openssl = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
